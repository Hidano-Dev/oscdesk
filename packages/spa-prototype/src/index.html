<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OscDesk 宛先(SPA 試作)</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: rgba(128,128,128,0.35);
    --primary: #1976d2; --negative: #f44336; --ok: #4caf50; --card: #f6f6f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121214; --fg: #ececf0; --muted: #a0a0a8; --card: #1d1d21; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 80px; }
  h2 { font-size: 17px; margin: 0; flex: 1; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 4px 0; }
  .caption { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .negative { color: var(--negative); }
  .break { word-break: break-all; }
  .link { font-size: 12px; margin: 0 0 8px; }
  .link.ok { color: var(--ok); }
  .link.lost { color: var(--negative); }
  .panel { display: flex; flex-direction: column; gap: 8px; }
  .panel-head, .panel-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel-foot { justify-content: space-between; }
  button { font: inherit; border-radius: 6px; border: 0; padding: 8px 12px; min-height: 40px; cursor: pointer; background: transparent; color: var(--primary); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--primary); color: #fff; }
  button.negative { color: var(--negative); }
  button.icon { margin-left: auto; min-width: 40px; font-size: 16px; color: var(--muted); }
  .search input, .dialog input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .group { border-top: 1px solid var(--line); padding-top: 4px; display: flex; flex-direction: column; gap: 4px; }
  .group-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 4px 0 0; }
  .check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 0; }
  .device { display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; border: 1px solid var(--line); border-radius: 6px; }
  .device > .caption { flex: 1; min-width: 0; }
  .device.mismatch { border-color: var(--negative); box-shadow: inset 0 0 0 1px var(--negative); }
  .marker { color: var(--negative); font-weight: 700; }
  .invisible { visibility: hidden; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { background: var(--bg); border-radius: 8px; padding: 16px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 8px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 4px; flex-wrap: wrap; }
  .notices { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .notice { pointer-events: auto; max-width: 520px; width: 100%; padding: 10px 14px; border-radius: 6px; color: #fff; background: #424242; }
  .notice.warn { background: #ef8f00; }
  .notice.error { background: var(--negative); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
