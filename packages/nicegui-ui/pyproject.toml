[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscdesk-nicegui-ui"
version = "0.1.0"
description = "NiceGUI control surface for OSCDesk (headless OSC/WebSocket bridge)"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    # surface_link は connect(..., proxy=None) を渡す(D-023)。proxy 引数は
    # websockets 14.0 で追加されたため、それ未満では接続が TypeError で全滅する
    "websockets>=14.0",
    # 宛先の検索の正規表現(D-086)。標準の re は照合を打ち切れず、バックトラックの爆発する式で
    # 全ブラウザが共有するイベントループが止まるため、timeout を持つ regex を使う
    "regex>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # テストの定義が構造として正しいかを、zod から生成した JSON Schema で確かめる(tests/surface_fixtures.py)。
    # 本番の UI は定義を検証しない(判定はブリッジ。D-122・D-123)
    "jsonschema>=4.18",
]

[project.scripts]
oscdesk-ui = "oscdesk_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oscdesk_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
